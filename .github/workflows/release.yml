name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the repository version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no [${version}] entry" >&2; exit 1; }

      - name: Checks
        run: |
          python3 tools/check.py --live
          python3 -m unittest discover -s tests
          node --test 'tests/*.test.mjs'

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # The install scripts are release assets: aimlapi.com/skills/install.{sh,ps1} serves the latest release's copy.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            install/install.sh install/install.ps1

      # Provenance needs a public repository; until then, and without the secret, this step only says why it skipped.
      - name: Publish @ai-ml.api/skills to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; npm publish skipped"
            exit 0
          fi
          if [ "$PRIVATE_REPO" = "true" ]; then
            echo "::notice::repository is private, npm provenance is impossible; npm publish skipped"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "package.json ${version} does not match ${GITHUB_REF_NAME}" >&2; exit 1; }
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" npm publish --provenance --access public
